name: FreeBSD

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd-build:
    name: 'FreeBSD 15.0 ${{matrix.arch}} ${{matrix.build_type}}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  build_type: RelWithDebInfo }
          - { arch: x86_64,  build_type: Debug }
          - { arch: aarch64, build_type: RelWithDebInfo }
    steps:
    - uses: actions/checkout@v6
    - name: Build and test in FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        release: "15.0"
        arch: ${{matrix.arch}}
        copyback: false
        usesh: true
        prepare: |
          pkg install -y cmake ninja pkgconf git
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
            -DCMAKE_INSTALL_PREFIX=$HOME/oink-install \
            -DOINK_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure -VV --timeout 60
          cmake --install build
          export PKG_CONFIG_PATH=$HOME/oink-install/lib/pkgconfig
          cd test/install/consumer-pkgconfig && sh test.sh && cd -
          export CMAKE_PREFIX_PATH=$HOME/oink-install
          cd test/install/consumer-cmake && sh test.sh
