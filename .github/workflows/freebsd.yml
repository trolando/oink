name: FreeBSD

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd-build:
    name: 'FreeBSD 15.0 ${{matrix.arch}} ${{matrix.build_type}}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  build_type: RelWithDebInfo, flags: "" }
          # char is unsigned on aarch64: check that in minutes here, not only in the emulated job
          - { arch: x86_64,  build_type: Debug,          flags: "-funsigned-char" }
          # emulated, so without debug information, which costs compile time
          - { arch: aarch64, build_type: Release,        flags: "" }
    steps:
    - uses: actions/checkout@v6
    # the compiler cache, kept between runs (the VM copies it back to the host)
    - uses: actions/cache@v6
      with:
        path: .ccache
        key: ccache-freebsd-${{matrix.arch}}-${{matrix.build_type}}-${{github.sha}}
        restore-keys: ccache-freebsd-${{matrix.arch}}-${{matrix.build_type}}-
    - name: Build and test in FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        release: "15.0"
        arch: ${{matrix.arch}}
        copyback: true
        usesh: true
        cache-after-prepare: true
        prepare: |
          pkg install -y cmake ninja pkgconf git ccache
        run: |
          set -e
          ROOT=$PWD
          export CCACHE_DIR=$ROOT/.ccache CCACHE_MAXSIZE=1G CCACHE_COMPRESS=1
          ccache -z
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DCMAKE_C_FLAGS=${{matrix.flags}}" \
            "-DCMAKE_CXX_FLAGS=${{matrix.flags}}" \
            -DCMAKE_INSTALL_PREFIX=$HOME/oink-install \
            -DOINK_BUILD_TESTS=ON
          cmake --build build
          ccache -s
          ctest --test-dir build --output-on-failure -VV --timeout 60
          cmake --install build
          export PKG_CONFIG_PATH=$HOME/oink-install/lib/pkgconfig
          cd test/install/consumer-pkgconfig && sh test.sh && cd -
          export CMAKE_PREFIX_PATH=$HOME/oink-install
          cd test/install/consumer-cmake && sh test.sh
          # copy back only the compiler cache
          cd $ROOT
          rm -rf build test/install/consumer-cmake/build
          rm -f test/install/consumer-pkgconfig/test
